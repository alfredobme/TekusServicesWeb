<h2 mat-dialog-title>Modify Service</h2>
<br>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>HourlyRate</mat-label>
      <input matInput type="number" formControlName="hourlyRate" class="text-right" min="0" step="0.01">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Provider</mat-label>
      <mat-select formControlName="providerId">
        <mat-option *ngFor="let p of providers" [value]="p.providerId">{{ p.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
    <mat-label>Countries</mat-label>
    <mat-select formControlName="countries" multiple>
        <mat-option *ngFor="let country of countries" [value]="country.code">
        {{ country.name }}
        </mat-option>
    </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Active</mat-label>
      <mat-select formControlName="active">
        <mat-option [value]="true">Yes</mat-option>
        <mat-option [value]="false">No</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close class="green-button">Cancel</button>
  <button mat-raised-button class="green-button" (click)="deleteService()">Delete</button>
  <button mat-raised-button class="green-button" (click)="modifyService()">Save</button>
</mat-dialog-actions>
